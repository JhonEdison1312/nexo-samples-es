# ADDED FOR THIS SAMPLE
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Configurar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql, curl
      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install redis
          sudo apt-get update
          sudo apt-get install -y postgresql-client pgbouncer redis-server g++ cmake libsqlite3-dev libssl-dev libcurl4-openssl-dev libspdlog-dev nlohmann-json3-dev shellcheck
      - name: Instalar gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Instalar actionlint
        run: |
          wget -q https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Verificar que las dependencias están en PATH
        run: make deps-check
      - name: Iniciar el entorno
        run: make up
      - name: Ejecutar comprobación de sintaxis PHP
        run: find samples -name "*.php" -exec php -l {} +
      - name: Ejecutar shellcheck
        run: shellcheck samples/*/harness/*.sh tools/env/*.sh tools/negative_tests.sh
      - name: Ejecutar actionlint
        run: actionlint .github/workflows/ci.yml
      - name: Ejecutar gitleaks sobre todo el historial
        run: gitleaks detect --source .
      - name: Ejecutar verify-fast
        run: make verify-fast
      - name: Pruebas negativas (cada sabotaje debe fallar)
        run: bash tools/negative_tests.sh
      - name: Prueba de la muestra 01
        run: bash samples/01-rls-pgbouncer/harness/test_pgbouncer_leak.sh
      - name: Prueba de la muestra 02
        run: bash samples/02-audit-chain/harness/test_tampering.sh
      - name: Prueba de la muestra 03
        run: bash samples/03-edge-pipeline/harness/test_edge_pipeline.sh
      - name: Prueba de la muestra 04
        run: php samples/04-nodus-parser/harness/test_parser.php
      - name: Prueba de la muestra 05
        run: python3 samples/05-redis-reliable-queue/harness/test_queue.py
      - name: Prueba de la muestra 06
        run: bash samples/06-table-partitioning/harness/test_partitioning.sh
      - name: Detener el entorno
        if: always()
        run: make down
